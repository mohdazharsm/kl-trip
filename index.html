<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KL Trip Plan — Aug 2026 · 2 People</title>

  <!-- PWA & Mobile Web App Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KL Trip">
  <meta name="theme-color" content="#0f1117">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230f1117'/%3E%3Ctext x='90' y='115' font-size='90' text-anchor='middle'%3E%F0%9F%8C%86%3C/text%3E%3C/svg%3E">

  <!-- Leaflet Map Styles -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body>

  <!-- Hero Header -->
  <div id="hero-container"></div>

  <!-- Exchange Rate & Budget Alert -->
  <div id="meta-alerts-container"></div>

  <!-- Trip Checklist Progress Tracker -->
  <div id="progress-container"></div>

  <!-- Live Travel Wallet (Cash & Card Tracker) -->
  <div id="wallet-container"></div>

  <!-- Confirmed Bookings (Flights & Hotel) -->
  <div id="fixed-bookings-container"></div>

  <!-- Day-Wise Tab Navigation -->
  <div id="day-tabs-container"></div>

  <!-- Day-by-Day Itinerary & Maps -->
  <div id="itinerary-container"></div>

  <!-- Budget Breakdown Table -->
  <div id="budget-container"></div>

  <!-- Shopping Guide -->
  <div id="shopping-container"></div>

  <!-- Pro Couple Travel Tips -->
  <div id="tips-container"></div>

  <!-- Summary Ribbon & Footer -->
  <div id="summary-container"></div>

  <!-- Log Extra Spend Modal Dialog -->
  <div id="expense-modal" class="modal-backdrop" onclick="closeExpenseModal(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div>
          <div class="modal-title" id="modal-title">➕ Log Extra Spend</div>
          <div class="modal-subtitle" id="modal-subtitle">Add spontaneous travel or food expense</div>
        </div>
        <button class="modal-close-btn" onclick="closeExpenseModal()" title="Close">✕</button>
      </div>

      <!-- Quick Fill Suggestions -->
      <div class="quick-chips-row">
        <button type="button" class="quick-chip" onclick="quickFillExpense('🥤 7-Eleven Snacks', 15, 'RM', 'cash')">🥤 7-Eleven (RM 15)</button>
        <button type="button" class="quick-chip" onclick="quickFillExpense('🚗 Grab / Bolt Ride', 25, 'RM', 'card')">🚗 Grab (RM 25)</button>
        <button type="button" class="quick-chip" onclick="quickFillExpense('🥥 Fresh Coconut', 10, 'RM', 'cash')">🥥 Coconut (RM 10)</button>
        <button type="button" class="quick-chip" onclick="quickFillExpense('🍦 Ice Cream / Dessert', 12, 'RM', 'cash')">🍦 Dessert (RM 12)</button>
        <button type="button" class="quick-chip" onclick="quickFillExpense('🛍 Souvenir / Craft', 30, 'RM', 'card')">🛍 Souvenir (RM 30)</button>
      </div>

      <form id="expense-form" onsubmit="saveCustomExpense(event)">
        <input type="hidden" id="modal-day-id" value="d1" />

        <div class="modal-form-group">
          <label class="modal-form-label">Expense Description</label>
          <input type="text" id="modal-desc" class="modal-input-text" placeholder="e.g. 7-Eleven drinks, Bolt ride, Mango sticky rice" required />
        </div>

        <div class="modal-form-group">
          <label class="modal-form-label">Amount &amp; Currency</label>
          <div class="amount-row">
            <button type="button" id="modal-curr-btn" class="currency-selector-btn" onclick="toggleModalCurrency()">Currency: RM</button>
            <input type="number" id="modal-amount" class="modal-amount-input" placeholder="0" step="any" min="0" required oninput="updateModalConversionPreview()" />
          </div>
          <div class="amount-conversion-preview" id="modal-conversion-preview">≈ ₹ 0</div>
        </div>

        <div class="modal-form-group">
          <label class="modal-form-label">Payment Method</label>
          <div class="payment-selector-grid">
            <div class="pay-option-card selected cash" id="poc-cash" onclick="selectModalPaymentMethod('cash')">
              <div class="poc-title">💵 Cash (RM)</div>
              <div class="poc-sub">Deducts Cash in Hand</div>
            </div>
            <div class="pay-option-card card" id="poc-card" onclick="selectModalPaymentMethod('card')">
              <div class="poc-title">💳 Card / Forex</div>
              <div class="poc-sub">Charges to Card</div>
            </div>
            <div class="pay-option-card bank" id="poc-bank" onclick="selectModalPaymentMethod('bank')">
              <div class="poc-title">🏦 Indian Bank</div>
              <div class="poc-sub">Debited from INR A/C</div>
            </div>
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-secondary" onclick="closeExpenseModal()">Cancel</button>
          <button type="submit" class="btn-primary">💾 Save Expense</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Leaflet Map Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  <!-- Data Models -->
  <script src="data/map-data.js"></script>
  <script src="data/itinerary.js"></script>
  <script src="data/trip-data.js"></script>

  <!-- App Storage & Controllers -->
  <script src="js/storage.js"></script>
  <script src="js/map.js"></script>
  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
